name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce and expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Node.js version
  - type: textarea
    id: details
    attributes:
      label: Relevant logs or context (remove secrets and private data)
